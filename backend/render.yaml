services:
  - type: web
    name: fixflow-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fixflow.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString

databases:
  - name: fixflow-db
    databaseName: fixflow_db
    user: fixflow_user
    plan: free
